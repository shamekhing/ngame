<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#0d0a16">
  <meta name="description" content="Catch the Girl: a two-player top-down chase.">
  <title>Catch the Girl</title>
  <script>
    if (window.self !== window.top) document.documentElement.className = 'framed';
  </script>
  <style>
    * { box-sizing: border-box; }
    html, body { width: 100%; height: 100%; margin: 0; background: #0d0a16; }
    body { display: flex; flex-direction: column; overflow: hidden; }
    #strip {
      flex: 0 0 auto; display: flex; flex-wrap: wrap; gap: 6px 10px;
      align-items: center; justify-content: center; padding: 7px 10px;
      font: 11px/1.5 ui-monospace, monospace; color: #e9e3ff;
      background: #171227; border-bottom: 1px solid #2a2140;
    }
    #strip b { letter-spacing: .09em; }
    #strip .where { opacity: .75; }
    #strip a, #strip button {
      font: inherit; color: #e9e3ff; background: #241a3d;
      text-decoration: none; border: 1px solid #9a8fbf;
      padding: 4px 9px; cursor: pointer;
    }
    html.framed #strip { display: none; }
    #stage { flex: 1 1 auto; position: relative; min-height: 0; }
    #game { display: block; width: 100%; height: 100%; border: 0; background: #0d0a16; }
    #note {
      position: absolute; left: 50%; bottom: 12px; transform: translateX(-50%);
      width: max-content; max-width: 92%; margin: 0; padding: 8px 12px;
      font: 11px/1.6 ui-monospace, monospace; color: #e9e3ff;
      background: #171227f2; border: 1px solid #9a8fbf;
      opacity: 0; transition: opacity .4s ease; pointer-events: none;
    }
    #note.show { opacity: 1; pointer-events: auto; }
    #note a { color: #e9e3ff; }
  </style>
</head>
<body>
  <div id="strip">
    <b>CATCH THE GIRL</b>
    <span class="where">played from shamekhing.github.io/ngame</span>
    <button id="full" type="button">FULLSCREEN</button>
    <a href="https://shamekhing.github.io/ngame/web/" target="_blank" rel="noopener">OPEN ON ITS OWN</a>
  </div>
  <div id="stage">
    <iframe id="game" title="Catch the Girl"
            src="https://shamekhing.github.io/ngame/web/"
            allow="autoplay; fullscreen; screen-wake-lock"
            allowfullscreen webkitallowfullscreen mozallowfullscreen></iframe>
    <p id="note">The game has not loaded. It needs the network —
      <a href="https://shamekhing.github.io/ngame/web/" target="_blank" rel="noopener">open it on its own</a> to check the connection.</p>
  </div>
  <script>
    (function () {
      var game = document.getElementById('game');
      var note = document.getElementById('note');
      var loaded = false;
      game.addEventListener('load', function () {
        loaded = true;
        note.className = '';
      });
      if (window.self === window.top) {
        setTimeout(function () { if (!loaded) note.className = 'show'; }, 6000);
      }
      document.getElementById('full').addEventListener('click', function () {
        var fn = game.requestFullscreen || game.webkitRequestFullscreen || game.mozRequestFullScreen;
        if (fn) {
          try {
            var result = fn.call(game);
            if (result && result.catch) result.catch(function () {});
          } catch (err) { /* The open-on-its-own link remains available. */ }
        }
        try { game.focus(); } catch (err) {}
      });
    })();
  </script>
</body>
</html>
